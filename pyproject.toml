[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmnps"
version = "0.1.0"
description = "Reproducible gut microbiome-informed nutrient profiling methods"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "joblib>=1.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pyarrow>=12",
  "statsmodels>=0.14",
  "pdfplumber>=0.10",
]

[tool.setuptools]
package-dir = {"" = "code/src"}

[tool.setuptools.packages.find]
where = ["code/src"]
