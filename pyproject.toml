[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gutnut"
version = "0.2.0"
description = "The source code of the article: Gut microbiome-informed calibration of nutrient profiling reconciles population consensus with precision nutrition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "scipy>=1.10,<2",
  "scikit-learn>=1.2,<2",
]

[project.urls]
Repository = "https://github.com/SunnyXi925/GutNut"

[tool.setuptools]
packages = ["gutnut", "gutnut.beta_i", "gutnut.scoring", "gutnut.response"]
include-package-data = false

[tool.setuptools.package-dir]
gutnut = "."
