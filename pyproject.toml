[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gutnut"
version = "0.2.0"
description = "Microbiome-informed nutrient profiling and empirical-reference response calibration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "scipy>=1.10,<2",
  "scikit-learn>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10", "joblib>=1.2,<2"]

[project.urls]
Repository = "https://github.com/SunnyXi925/GutNut"

[tool.setuptools.packages.find]
where = ["code/src"]
include = ["gmnps*"]

[tool.pytest.ini_options]
testpaths = ["code/src/tests"]
